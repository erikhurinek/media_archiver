# .github/workflows/release.yml
name: Build and Release

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.2.3, etc.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller tqdm

      - name: Build
        run: |
          pyinstaller --onedir --name archive archive.py
          tar -czf archive-linux-x86_64.tar.gz -C dist archive

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: archive-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller tqdm

      - name: Build
        run: |
          pyinstaller --onedir --name archive archive.py
          Compress-Archive -Path dist\archive -DestinationPath archive-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: archive-windows-x86_64.zip

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write         # required to create releases

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/archive-linux-x86_64.tar.gz
            artifacts/archive-windows-x86_64.zip
          generate_release_notes: true   # auto-generates changelog from commits
